# 多轮追问评测集
#
# 20 段对话，覆盖 6 类追问：省略、追加条件、换维度 / 下钻、引用上一轮结果、纠正口径、新话题
# 格式与 traps.yaml 相同（单轮题就是只有一轮的会话），第 2 轮起每轮多两个字段：
#   gold_intent      期望的意图：new / followup / result_qa（见 app/core/conversation.py）
#   gold_standalone  期望的改写结果（独立完整的问题）；teacher forcing 模式用它填充历史，
#                    评测时不逐字比对，改写对不对看本轮 SQL 的执行结果
# 第 1 轮的意图固定为 new，不需要标注
#
# 追问轮的 trap_sql 一般是“没有正确承接上文”的写法：沿用上一轮的 SQL、承接错了对象、
# 或者把无关的上文条件带了进来；check_dataset 会确认它的结果与标准答案不同，
# 保证每一轮追问都真正改变了答案
#
# result_qa（针对上一轮结果提问）目前仍改写成独立问题重新查库，所以同样用 gold_sql 判分；
# 标准 SQL 只选出被问到的列（如“哪个大区”只选大区），模型多选列不影响判分
#
# 与单轮题一样依赖生成数据，修改数据生成器后需要重新运行：
#   uv run python -m evals.check_dataset -d evals/datasets/multiturn.yaml --per-category 0

# ---------------------------------------------------------------------------
# 1. 省略 / 指代：“那华南呢”“4 月呢”
# ---------------------------------------------------------------------------
- id: mt_ellipsis_01
  category: ellipsis
  tags: [多轮, 省略, 地区]
  difficulty: easy
  today: "2025-12-31"
  must_pass: true
  turns:
    - question: 2025 年华北大区的销售额是多少？
      gold_sql: |
        select sum(o.order_amount) as 销售额
        from fact_order o
        join dim_region r on o.receiver_region_id = r.region_id
        where o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
          and r.area = '华北'
      trap_sql: |
        select sum(o.order_amount) as 销售额
        from fact_order o
        join dim_user u on o.user_id = u.user_id
        join dim_region r on u.region_id = r.region_id
        where o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
          and r.area = '华北'
      trap: 按用户常住地统计，订单的地区默认指收货地
      expect:
        tables: [fact_order, dim_region]
        metrics: [支付金额]
        values: [华北]
      order_matters: false
    - question: 那华南呢？
      gold_intent: followup
      gold_standalone: 2025 年华南大区的销售额是多少？
      gold_sql: |
        select sum(o.order_amount) as 销售额
        from fact_order o
        join dim_region r on o.receiver_region_id = r.region_id
        where o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
          and r.area = '华南'
      trap_sql: |
        select sum(o.order_amount) as 销售额
        from fact_order o
        join dim_region r on o.receiver_region_id = r.region_id
        where o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
          and r.area = '华北'
      trap: 没有承接本轮的变化，仍按上一轮的华北统计
      expect:
        tables: [fact_order, dim_region]
        metrics: [支付金额]
        values: [华南]
      order_matters: false
    - question: 西南呢
      gold_intent: followup
      gold_standalone: 2025 年西南大区的销售额是多少？
      gold_sql: |
        select sum(o.order_amount) as 销售额
        from fact_order o
        join dim_region r on o.receiver_region_id = r.region_id
        where o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
          and r.area = '西南'
      trap_sql: |
        select sum(o.order_amount) as 销售额
        from fact_order o
        join dim_region r on o.receiver_region_id = r.region_id
        where o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
          and r.area in ('华南', '西南')
      trap: 把上一轮的华南和本轮的西南叠加在一起，应该替换
      expect:
        tables: [fact_order, dim_region]
        metrics: [支付金额]
        values: [西南]
      order_matters: false

- id: mt_ellipsis_02
  category: ellipsis
  tags: [多轮, 省略, 时间]
  difficulty: easy
