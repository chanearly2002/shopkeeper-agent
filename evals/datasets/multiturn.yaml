        where pay_time is not null
          and pay_date_id between 20250401 and 20250430
      trap_sql: |
        select count(*) as 支付订单数
        from fact_order
        where pay_time is not null
          and pay_date_id between 20250301 and 20250331
      trap: 没有承接本轮的变化，仍按 3 月统计
      expect:
