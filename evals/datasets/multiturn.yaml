- id: mt_add_filter_03
  category: add_filter
  tags: [多轮, 追加条件, 雪花, 店铺]
  difficulty: hard
  today: "2025-12-31"
  turns:
    - question: 2025 年第三季度各一级类目的销售额
      gold_sql: |
        select c.category_l1 as 一级类目, sum(i.pay_amount) as 销售额
        from fact_order_item i
        join fact_order o on i.order_id = o.order_id
        join dim_sku k on i.sku_id = k.sku_id
        join dim_category c on k.category_id = c.category_id
        where o.pay_time is not null
          and o.pay_date_id between 20250701 and 20250930
        group by c.category_l1
      trap_sql: |
        select c.category_l1 as 一级类目, sum(o.order_amount) as 销售额
        from fact_order o
        join fact_order_item i on i.order_id = o.order_id
        join dim_sku k on i.sku_id = k.sku_id
        join dim_category c on k.category_id = c.category_id
        where o.pay_time is not null
          and o.pay_date_id between 20250701 and 20250930
        group by c.category_l1
      trap: 订单金额关联明细后求和，一笔多件商品的订单被重复计算
      expect:
        tables: [fact_order, fact_order_item, dim_sku, dim_category]
        metrics: [支付金额]
      order_matters: false
    - question: 只看自营店铺的
      gold_intent: followup
      gold_standalone: 2025 年第三季度自营店铺各一级类目的销售额
      gold_sql: |
        select c.category_l1 as 一级类目, sum(i.pay_amount) as 销售额
        from fact_order_item i
        join fact_order o on i.order_id = o.order_id
        join dim_sku k on i.sku_id = k.sku_id
        join dim_category c on k.category_id = c.category_id
        join dim_shop s on k.shop_id = s.shop_id
        where o.pay_time is not null
          and o.pay_date_id between 20250701 and 20250930
          and s.shop_type = '自营'
        group by c.category_l1
      trap_sql: |
        select c.category_l1 as 一级类目, sum(i.pay_amount) as 销售额
        from fact_order_item i
        join fact_order o on i.order_id = o.order_id
        join dim_sku k on i.sku_id = k.sku_id
        join dim_category c on k.category_id = c.category_id
        where o.pay_time is not null
          and o.pay_date_id between 20250701 and 20250930
        group by c.category_l1
      trap: 没有加上本轮追加的自营条件
      expect:
        tables: [fact_order, fact_order_item, dim_sku, dim_category, dim_shop]
        metrics: [支付金额]
        values: [自营]
      order_matters: false

