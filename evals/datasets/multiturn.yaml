# ---------------------------------------------------------------------------
# 3. 换维度 / 下钻：“按月拆开”“换成按性别看”“下钻到省份”
# ---------------------------------------------------------------------------
- id: mt_change_dim_01
  category: change_dim
  tags: [多轮, 下钻, 时间, 平台]
  difficulty: medium
  today: "2025-12-31"
  must_pass: true
  turns:
    - question: 2025 年第二季度的销售额是多少？
      gold_sql: |
        select sum(order_amount) as 销售额
        from fact_order
        where pay_time is not null
          and pay_date_id between 20250401 and 20250630
      trap_sql: |
        select sum(order_amount) as 销售额
        from fact_order
        where order_date_id between 20250401 and 20250630
      trap: 没有排除未支付和已取消的订单，算成了下单金额
      expect:
        tables: [fact_order]
        metrics: [支付金额]
      order_matters: false
    - question: 按月拆开看
      gold_intent: followup
      gold_standalone: 2025 年第二季度每个月的销售额
      gold_sql: |
        select d.month as 月份, sum(o.order_amount) as 销售额
        from fact_order o
        join dim_date d on o.pay_date_id = d.date_id
        where o.pay_time is not null
          and d.year = 2025 and d.quarter = 2
        group by d.month
      trap_sql: |
        select sum(order_amount) as 销售额
        from fact_order
        where pay_time is not null
          and pay_date_id between 20250401 and 20250630
      trap: 没有按本轮要求拆分到月
      expect:
        tables: [fact_order, dim_date]
        metrics: [支付金额]
      order_matters: false
    - question: 再按平台拆一下
      gold_intent: followup
      gold_standalone: 2025 年第二季度每个月各平台的销售额
      gold_sql: |
        select d.month as 月份, o.platform as 平台, sum(o.order_amount) as 销售额
        from fact_order o
        join dim_date d on o.pay_date_id = d.date_id
        where o.pay_time is not null
          and d.year = 2025 and d.quarter = 2
        group by d.month, o.platform
      trap_sql: |
