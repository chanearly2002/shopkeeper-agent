        metrics: [支付订单数]
      order_matters: false

- id: mt_ellipsis_03
  category: ellipsis
  tags: [多轮, 省略, 指代, 品牌]
  difficulty: medium
  today: "2025-12-31"
  turns:
    - question: 2025 年小米品牌的销售额是多少？
      gold_sql: |
        select sum(i.pay_amount) as 销售额
        from fact_order_item i
        join fact_order o on i.order_id = o.order_id
        join dim_sku k on i.sku_id = k.sku_id
        where o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
          and k.brand_name = '小米'
      trap_sql: |
        select sum(o.order_amount) as 销售额
        from fact_order o
        join fact_order_item i on i.order_id = o.order_id
        join dim_sku k on i.sku_id = k.sku_id
        where o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
          and k.brand_name = '小米'
      trap: 订单金额关联明细后求和，订单被重复计算，且混入了同一订单里其他品牌的金额
      expect:
        tables: [fact_order, fact_order_item, dim_sku]
        metrics: [支付金额]
        values: [小米]
      order_matters: false
    - question: 耐克呢？
      gold_intent: followup
      gold_standalone: 2025 年耐克品牌的销售额是多少？
      gold_sql: |
        select sum(i.pay_amount) as 销售额
        from fact_order_item i
        join fact_order o on i.order_id = o.order_id
        join dim_sku k on i.sku_id = k.sku_id
        where o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
          and k.brand_name = '耐克'
      trap_sql: |
        select sum(i.pay_amount) as 销售额
        from fact_order_item i
        join fact_order o on i.order_id = o.order_id
        join dim_sku k on i.sku_id = k.sku_id
        where o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
          and k.brand_name = '小米'
      trap: 没有承接本轮的变化，仍按小米统计
      expect:
        tables: [fact_order, fact_order_item, dim_sku]
        metrics: [支付金额]
        values: [耐克]
      order_matters: false
    - question: 它的件单价是多少？
      gold_intent: followup
      gold_standalone: 2025 年耐克品牌的件单价是多少？
      gold_sql: |
        select sum(i.pay_amount) / sum(i.quantity) as 件单价
        from fact_order_item i
        join fact_order o on i.order_id = o.order_id
        join dim_sku k on i.sku_id = k.sku_id
        where o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
          and k.brand_name = '耐克'
      trap_sql: |
        select sum(i.pay_amount) / sum(i.quantity) as 件单价
        from fact_order_item i
        join fact_order o on i.order_id = o.order_id
        join dim_sku k on i.sku_id = k.sku_id
        where o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
          and k.brand_name = '小米'
      trap: “它”指最近一轮的耐克，承接成了第一轮的小米
      expect:
        tables: [fact_order, fact_order_item, dim_sku]
        metrics: [件单价]
        values: [耐克]
      order_matters: false

- id: mt_ellipsis_04
  category: ellipsis
  tags: [多轮, 省略, 下单口径, 平台]
  difficulty: easy
  today: "2025-12-31"
  turns:
    - question: 2025 年 PC 端的下单订单数是多少？
      gold_sql: |
        select count(*) as 下单订单数
        from fact_order
        where platform = 'PC'
          and order_date_id between 20250101 and 20251231
      trap_sql: |
        select count(*) as 下单订单数
        from fact_order
        where platform = 'PC'
          and pay_time is not null
          and pay_date_id between 20250101 and 20251231
      trap: 只统计了已支付订单，下单订单数应包含未支付和已取消订单
      expect:
        tables: [fact_order]
        metrics: [下单订单数]
        values: [PC]
      order_matters: false
    - question: 小程序的呢
      gold_intent: followup
      gold_standalone: 2025 年小程序端的下单订单数是多少？
      gold_sql: |
        select count(*) as 下单订单数
        from fact_order
        where platform = '小程序'
          and order_date_id between 20250101 and 20251231
      trap_sql: |
        select count(*) as 下单订单数
        from fact_order
        where platform = 'PC'
          and order_date_id between 20250101 and 20251231
      trap: 没有承接本轮的变化，仍按 PC 端统计
      expect:
        tables: [fact_order]
        metrics: [下单订单数]
        values: [小程序]
      order_matters: false

# ---------------------------------------------------------------------------
# 2. 追加条件：“只看钻石会员”“只算 APP 下的单”
# ---------------------------------------------------------------------------
- id: mt_add_filter_01
  category: add_filter
  tags: [多轮, 追加条件, 会员, 去重计数]
  difficulty: medium
  today: "2025-12-31"
  must_pass: true
  turns:
    - question: 2025 年各大区的支付买家数
      gold_sql: |
        select r.area as 大区, count(distinct o.user_id) as 支付买家数
        from fact_order o
        join dim_region r on o.receiver_region_id = r.region_id
        where o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
        group by r.area
      trap_sql: |
        select r.area as 大区, count(o.user_id) as 支付买家数
        from fact_order o
        join dim_region r on o.receiver_region_id = r.region_id
        where o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
        group by r.area
      trap: 没有去重，算成了支付订单数
      expect:
        tables: [fact_order, dim_region]
        metrics: [支付买家数]
      order_matters: false
    - question: 只看钻石会员
      gold_intent: followup
      gold_standalone: 2025 年钻石会员在各大区的支付买家数
      gold_sql: |
        select r.area as 大区, count(distinct o.user_id) as 支付买家数
        from fact_order o
        join dim_region r on o.receiver_region_id = r.region_id
        join dim_user u on o.user_id = u.user_id
        where o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
          and u.member_level = '钻石'
        group by r.area
      trap_sql: |
        select r.area as 大区, count(distinct o.user_id) as 支付买家数
        from fact_order o
        join dim_region r on o.receiver_region_id = r.region_id
        where o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
        group by r.area
      trap: 没有加上本轮追加的会员等级条件
      expect:
        tables: [fact_order, dim_region, dim_user]
        metrics: [支付买家数]
        values: [钻石]
      order_matters: false

