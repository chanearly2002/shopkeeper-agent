- id: relative_time_05
  category: relative_time
  tags: [多表, 相对时间, 同比]
  difficulty: hard
  today: "2025-12-31"
  turns:
    - question: 今年第三季度的销售额和去年同期相比增长了多少？
      paraphrases:
        - 今年 Q3 销售额的同比增长率
      gold_sql: |
        select (sum(case when d.year = 2025 then o.order_amount end)
                - sum(case when d.year = 2024 then o.order_amount end))
               / sum(case when d.year = 2024 then o.order_amount end) as 同比增长率
        from fact_order o
        join dim_date d on o.pay_date_id = d.date_id
        where o.pay_time is not null
          and d.quarter = 3
          and d.year in (2024, 2025)
      trap_sql: |
        select (sum(case when d.quarter = 3 then o.order_amount end)
                - sum(case when d.quarter = 2 then o.order_amount end))
               / sum(case when d.quarter = 2 then o.order_amount end) as 同比增长率
        from fact_order o
        join dim_date d on o.pay_date_id = d.date_id
        where o.pay_time is not null
          and d.year = 2025
          and d.quarter in (2, 3)
      trap: 把“去年同期”算成了上一季度（环比）
      expect:
        tables: [fact_order, dim_date]
        metrics: [支付金额]
      order_matters: false

