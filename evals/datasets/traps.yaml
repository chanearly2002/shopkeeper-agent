# ---------------------------------------------------------------------------
# 5. 地区角色：收货城市（fact_order.receiver_region_id）与用户常住城市（dim_user.region_id）
# ---------------------------------------------------------------------------
- id: region_role_01
  category: region_role
  tags: [多表, 地区角色]
  difficulty: medium
  today: "2025-12-31"
  must_pass: true
  turns:
    - question: 2025 年发往上海市的支付订单有多少笔？
      paraphrases:
        - 今年收货地址在上海的成交订单数
      gold_sql: |
        select count(*) as 支付订单数
        from fact_order o
        join dim_region r on o.receiver_region_id = r.region_id
        where r.city = '上海市'
          and o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
      trap_sql: |
        select count(*) as 支付订单数
        from fact_order o
        join dim_user u on o.user_id = u.user_id
        join dim_region r on u.region_id = r.region_id
        where r.city = '上海市'
          and o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
      trap: 按用户常住城市统计，而问题问的是收货城市
      expect:
        tables: [fact_order, dim_region]
        values: [上海市]
      order_matters: false

