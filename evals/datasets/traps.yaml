- id: relative_time_03
  category: relative_time
  tags: [单表, 相对时间, 同比]
  difficulty: medium
  today: "2025-12-31"
  turns:
    - question: 今年和去年的销售额分别是多少？今年同比增长了多少？
      paraphrases:
        - 对比今年和去年的销售额，算一下同比增长率
      gold_sql: |
        select t.今年销售额, t.去年销售额,
               (t.今年销售额 - t.去年销售额) / t.去年销售额 as 同比增长率
        from (
          select sum(case when pay_date_id between 20250101 and 20251231 then order_amount end) as 今年销售额,
                 sum(case when pay_date_id between 20240101 and 20241231 then order_amount end) as 去年销售额
          from fact_order
          where pay_time is not null
        ) t
      trap_sql: |
        select t.今年销售额, t.去年销售额,
               (t.今年销售额 - t.去年销售额) / t.今年销售额 as 同比增长率
        from (
          select sum(case when pay_date_id between 20250101 and 20251231 then order_amount end) as 今年销售额,
                 sum(case when pay_date_id between 20240101 and 20241231 then order_amount end) as 去年销售额
          from fact_order
          where pay_time is not null
        ) t
      trap: 同比增长率的分母应该是去年的值
      expect:
        tables: [fact_order]
        metrics: [支付金额]
      order_matters: false

