# 10. 漏斗分母：转化率、复购率的分子分母要在同一时间范围、同一人群、同一计数单位
# ---------------------------------------------------------------------------
- id: funnel_01
  category: funnel
  tags: [多表, 指标, 转化率]
  difficulty: medium
  today: "2025-12-31"
  must_pass: true
  turns:
    - question: 2025 年 12 月的浏览转化率是多少？
      paraphrases:
        - 这个月浏览用户里有多大比例下单付款了
      gold_sql: |
        select
          (select count(distinct user_id) from fact_order
           where pay_time is not null and pay_date_id between 20251201 and 20251231)
          /
          (select count(distinct user_id) from fact_user_behavior
           where behavior_type = '浏览' and date_id between 20251201 and 20251231) as 浏览转化率
      trap_sql: |
        select
          (select count(distinct user_id) from fact_order
           where pay_time is not null and pay_date_id between 20251201 and 20251231)
          /
          (select count(*) from fact_user_behavior
           where behavior_type = '浏览' and date_id between 20251201 and 20251231) as 浏览转化率
      trap: 分母用了浏览次数而不是浏览用户数
      expect:
        tables: [fact_order, fact_user_behavior]
        metrics: [浏览转化率]
      order_matters: false

- id: funnel_02
  category: funnel
  tags: [多表, 转化率, 人群]
  difficulty: hard
  today: "2025-12-31"
  turns:
    - question: 2025 年 12 月加购过商品的用户中，当月完成支付的比例是多少？
      paraphrases:
        - 这个月加购用户的支付转化率
      gold_sql: |
        select count(distinct p.user_id) / count(distinct c.user_id) as 加购支付转化率
        from (
          select distinct user_id from fact_user_behavior
          where behavior_type = '加购' and date_id between 20251201 and 20251231
        ) c
        left join (
          select distinct user_id from fact_order
          where pay_time is not null and pay_date_id between 20251201 and 20251231
        ) p on p.user_id = c.user_id
      trap_sql: |
        select
          (select count(distinct user_id) from fact_order
           where pay_time is not null and pay_date_id between 20251201 and 20251231)
          /
          (select count(distinct user_id) from fact_user_behavior
           where behavior_type = '加购' and date_id between 20251201 and 20251231) as 加购支付转化率
      trap: 分子用了全部支付买家，没有限定在加购用户之内，比例可能超过 100%
      expect:
        tables: [fact_order, fact_user_behavior]
        values: [加购]
      order_matters: false

- id: funnel_03
  category: funnel
  tags: [多表, 雪花, 转化率, 人群]
  difficulty: hard
  today: "2025-12-31"
  turns:
    - question: 2025 年 11 月浏览过美妆个护商品的用户中，有多少比例在当月买了美妆个护商品？
      paraphrases:
        - 11 月美妆个护的浏览到购买转化率（按人）
      gold_sql: |
        select count(distinct buy.user_id) / count(distinct browse.user_id) as 转化率
        from (
          select distinct b.user_id
          from fact_user_behavior b
          join dim_sku k on b.sku_id = k.sku_id
          join dim_category c on k.category_id = c.category_id
          where b.behavior_type = '浏览' and c.category_l1 = '美妆个护'
            and b.date_id between 20251101 and 20251130
        ) browse
        left join (
          select distinct o.user_id
          from fact_order_item i
          join fact_order o on i.order_id = o.order_id
          join dim_sku k on i.sku_id = k.sku_id
          join dim_category c on k.category_id = c.category_id
          where c.category_l1 = '美妆个护' and o.pay_time is not null
            and o.pay_date_id between 20251101 and 20251130
        ) buy on buy.user_id = browse.user_id
      trap_sql: |
        select count(distinct buy.user_id) / count(distinct browse.user_id) as 转化率
        from (
          select distinct b.user_id
          from fact_user_behavior b
          where b.behavior_type = '浏览'
            and b.date_id between 20251101 and 20251130
        ) browse
        left join (
          select distinct o.user_id
          from fact_order_item i
          join fact_order o on i.order_id = o.order_id
          join dim_sku k on i.sku_id = k.sku_id
          join dim_category c on k.category_id = c.category_id
          where c.category_l1 = '美妆个护' and o.pay_time is not null
            and o.pay_date_id between 20251101 and 20251130
        ) buy on buy.user_id = browse.user_id
      trap: 分母用了全部浏览用户，没有限定浏览的是美妆个护商品
      expect:
        tables: [fact_order, fact_order_item, fact_user_behavior, dim_sku, dim_category]
        values: [美妆个护, 浏览]
      order_matters: false

- id: funnel_04
  category: funnel
  tags: [单表, 指标, 复购率]
  difficulty: medium
  today: "2025-12-31"
  turns:
    - question: 2025 年 11 月的复购率是多少？
      paraphrases:
        - 11 月份买了两次及以上的用户占比
      gold_sql: |
        select sum(case when cnt >= 2 then 1 else 0 end) / count(*) as 复购率
        from (
          select user_id, count(*) as cnt
          from fact_order
          where pay_time is not null
            and pay_date_id between 20251101 and 20251130
          group by user_id
        ) t
      trap_sql: |
        select sum(case when cnt >= 2 then 1 else 0 end) / count(*) as 复购率
        from (
          select user_id, count(*) as cnt
          from fact_order
          where order_date_id between 20251101 and 20251130
          group by user_id
        ) t
      trap: 按下单统计，已取消和未支付的订单也算作一次购买
      expect:
        tables: [fact_order]
        metrics: [复购率]
      order_matters: false

- id: funnel_05
  category: funnel
  tags: [多表, 转化率, 分组, 渠道]
  difficulty: hard
  today: "2025-12-31"
  turns:
    - question: 2025 年 12 月各终端的浏览转化率分别是多少？用该终端的支付买家数除以该终端的浏览用户数。
      paraphrases:
        - 这个月 APP、小程序、PC、H5 各自的浏览转化率
      gold_sql: |
        select v.platform as 终端, coalesce(p.buyers, 0) / v.visitors as 浏览转化率
        from (
          select platform, count(distinct user_id) as visitors
          from fact_user_behavior
          where behavior_type = '浏览' and date_id between 20251201 and 20251231
          group by platform
        ) v
        left join (
          select platform, count(distinct user_id) as buyers
          from fact_order
          where pay_time is not null and pay_date_id between 20251201 and 20251231
          group by platform
        ) p on p.platform = v.platform
      trap_sql: |
        select p.platform as 终端,
               p.buyers / (select count(distinct user_id) from fact_user_behavior
                           where behavior_type = '浏览' and date_id between 20251201 and 20251231) as 浏览转化率
        from (
          select platform, count(distinct user_id) as buyers
          from fact_order
          where pay_time is not null and pay_date_id between 20251201 and 20251231
          group by platform
        ) p
      trap: 分母用了全站浏览用户数，没有按终端拆分
      expect:
        tables: [fact_order, fact_user_behavior]
        metrics: [浏览转化率]
      order_matters: false
