# 业务口径陷阱评测集
#
# 10 类“SQL 语法正确、业务口径错误”的陷阱，每类 5 题，共 50 题
# 陷阱分类见 docs/design/dw-schema-v2.md 第六节；口径以 conf/meta_config.yaml 的指标定义为准：
#   - “销售额”默认指支付金额：fact_order.pay_time IS NOT NULL，按支付日期 pay_date_id 筛选时间
#   - 按商品 类目 品牌 活动拆分金额时用 fact_order_item.pay_amount（不含运费）
#   - 退款只认 refund_status = '退款成功'
#
# 字段说明：
#   id          唯一标识，前缀是陷阱类别
#   category    陷阱类别
#   tags        用于按类别统计准确率
#   difficulty  easy / medium / hard
#   today       注入给模型的“今天”，保证相对时间可复现
#   must_pass   核心场景，失败即视为回归
#   turns       对话轮次；单轮题只有一轮
#     question      用户问题
#     paraphrases   同一标准 SQL 的其他问法
#     gold_sql      标准 SQL，评测时与模型 SQL 比较执行结果
#     trap_sql      该陷阱的典型错误写法；check_dataset 会确认它的结果与标准答案不同，
#                   否则这道题测不出这个陷阱
#     trap          错误写法错在哪里
#     expect        回答本题需要的表 / 指标 / 取值，用于失败时归因到召回或过滤环节
#     order_matters 标准 SQL 有 ORDER BY 且顺序是问题的一部分时为 true
#
# 修改数据生成器（app/scripts/dw_generator.py）后需要重新运行：
#   uv run python -m evals.check_dataset

# ---------------------------------------------------------------------------
# 1. 下单与支付口径：销售额 / 订单数默认只算已支付订单，下单金额才包含未支付和已取消
# ---------------------------------------------------------------------------
- id: order_vs_pay_01
  category: order_vs_pay
  tags: [单表, 指标, 支付口径]
  difficulty: easy
  today: "2025-12-31"
  must_pass: true
  turns:
    - question: 2025 年的销售额是多少？
      paraphrases:
        - 今年一共卖了多少钱
      gold_sql: |
        select sum(order_amount) as 销售额
        from fact_order
        where pay_time is not null
          and pay_date_id between 20250101 and 20251231
      trap_sql: |
        select sum(order_amount) as 销售额
        from fact_order
        where order_date_id between 20250101 and 20251231
      trap: 没有排除未支付和已取消的订单，算成了下单金额
      expect:
        tables: [fact_order]
        metrics: [支付金额]
      order_matters: false

- id: order_vs_pay_02
  category: order_vs_pay
  tags: [单表, 指标, 分组, 支付口径]
  difficulty: easy
  today: "2025-12-31"
  turns:
    - question: 2025 年每个月的支付订单数是多少？
      paraphrases:
        - 今年各月成交了多少单
      gold_sql: |
        select d.month as 月份, count(*) as 支付订单数
        from fact_order o
        join dim_date d on o.pay_date_id = d.date_id
        where o.pay_time is not null and d.year = 2025
        group by d.month
      trap_sql: |
        select d.month as 月份, count(*) as 支付订单数
        from fact_order o
        join dim_date d on o.order_date_id = d.date_id
        where d.year = 2025
        group by d.month
      trap: 统计了全部下单订单，包含已取消和待支付
      expect:
        tables: [fact_order, dim_date]
        metrics: [支付订单数]
      order_matters: false

- id: order_vs_pay_03
  category: order_vs_pay
  tags: [单表, 指标, 多指标对比]
  difficulty: medium
  today: "2025-12-31"
  turns:
    - question: 2025 年 6 月 1 日到 6 月 18 日下单的订单，下单金额和支付金额分别是多少？
      paraphrases:
        - 今年 618 期间下单的订单，拍下金额和实际支付金额各是多少
      gold_sql: |
        select sum(order_amount) as 下单金额,
               sum(case when pay_time is not null then order_amount end) as 支付金额
        from fact_order
        where order_date_id between 20250601 and 20250618
      trap_sql: |
        select sum(order_amount) as 下单金额,
               sum(order_amount) as 支付金额
        from fact_order
        where order_date_id between 20250601 and 20250618
      trap: 把下单金额当成支付金额，没有区分两种口径
      expect:
        tables: [fact_order]
        metrics: [下单金额, 支付金额]
      order_matters: false

- id: order_vs_pay_04
  category: order_vs_pay
  tags: [多表, 指标, 分组, 排序, 支付口径]
  difficulty: medium
  today: "2025-12-31"
  turns:
    - question: 2025 年各类型店铺的销售额是多少？按销售额从高到低排列。
      paraphrases:
        - 今年自营、旗舰店、专卖店、专营店各卖了多少，从高到低排
      gold_sql: |
        select s.shop_type as 店铺类型, sum(o.order_amount) as 销售额
        from fact_order o
        join dim_shop s on o.shop_id = s.shop_id
        where o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
        group by s.shop_type
        order by 销售额 desc
      trap_sql: |
        select s.shop_type as 店铺类型, sum(o.order_amount) as 销售额
        from fact_order o
        join dim_shop s on o.shop_id = s.shop_id
        where o.order_date_id between 20250101 and 20251231
        group by s.shop_type
        order by 销售额 desc
      trap: 没有限定已支付，把已取消、待支付的订单金额也算进销售额
      expect:
        tables: [fact_order, dim_shop]
        metrics: [支付金额]
        values: []
      order_matters: true

- id: order_vs_pay_05
  category: order_vs_pay
  tags: [单表, 状态]
  difficulty: medium
  today: "2025-12-31"
  turns:
    - question: 2025 年被取消的订单有多少笔，涉及金额多少？
      paraphrases:
        - 今年取消了多少单，取消的订单总金额是多少
      gold_sql: |
        select count(*) as 取消订单数, sum(order_amount) as 取消订单金额
        from fact_order
        where order_status = '已取消'
          and order_date_id between 20250101 and 20251231
      trap_sql: |
        select count(*) as 取消订单数, sum(order_amount) as 取消订单金额
        from fact_order
        where pay_time is null
          and order_date_id between 20250101 and 20251231
      trap: 用“未支付”代替“已取消”，把待支付订单也算了进去
      expect:
        tables: [fact_order]
        values: [已取消]
      order_matters: false

# ---------------------------------------------------------------------------
# 2. 订单头与明细扇出：订单级金额与明细表关联后再求和会被重复计算
# ---------------------------------------------------------------------------
- id: fanout_01
  category: fanout
  tags: [多表, 雪花, 指标, 分组, 支付口径]
  difficulty: medium
  today: "2025-12-31"
  must_pass: true
  turns:
    - question: 2025 年各一级类目的销售额是多少？
      paraphrases:
        - 今年每个大类卖了多少钱
      gold_sql: |
        select c.category_l1 as 一级类目, sum(i.pay_amount) as 销售额
        from fact_order_item i
        join fact_order o on i.order_id = o.order_id
        join dim_sku k on i.sku_id = k.sku_id
        join dim_category c on k.category_id = c.category_id
        where o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
        group by c.category_l1
      trap_sql: |
        select c.category_l1 as 一级类目, sum(o.order_amount) as 销售额
        from fact_order o
        join fact_order_item i on i.order_id = o.order_id
        join dim_sku k on i.sku_id = k.sku_id
        join dim_category c on k.category_id = c.category_id
        where o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
        group by c.category_l1
      trap: 订单金额关联明细后求和，一笔多件商品的订单被重复计算
      expect:
        tables: [fact_order, fact_order_item, dim_sku, dim_category]
        metrics: [支付金额]
      order_matters: false

- id: fanout_02
  category: fanout
  tags: [多表, 存在性, 支付口径]
  difficulty: hard
  today: "2025-12-31"
  turns:
    - question: 2025 年包含活动商品的已支付订单，订单总金额是多少？
      paraphrases:
        - 今年有参与活动商品的支付订单，一共付了多少钱
      gold_sql: |
        select sum(o.order_amount) as 订单总金额
        from fact_order o
        where o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
          and exists (
            select 1 from fact_order_item i
            where i.order_id = o.order_id and i.activity_id is not null
          )
      trap_sql: |
        select sum(o.order_amount) as 订单总金额
        from fact_order o
        join fact_order_item i on i.order_id = o.order_id
        where o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
          and i.activity_id is not null
      trap: 一笔订单里有多件活动商品时，订单金额被重复累加
      expect:
        tables: [fact_order, fact_order_item]
        metrics: [支付金额]
      order_matters: false

- id: fanout_03
  category: fanout
  tags: [多表, 雪花, 指标, 平均值]
  difficulty: hard
  today: "2025-12-31"
  turns:
    - question: 2025 年购买了美妆个护商品的支付订单，平均每笔订单金额是多少？
      paraphrases:
        - 今年含美妆个护商品的订单笔单价是多少
      gold_sql: |
        select avg(o.order_amount) as 笔单价
        from fact_order o
        where o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
          and o.order_id in (
            select i.order_id
            from fact_order_item i
            join dim_sku k on i.sku_id = k.sku_id
            join dim_category c on k.category_id = c.category_id
            where c.category_l1 = '美妆个护'
          )
      trap_sql: |
        select avg(o.order_amount) as 笔单价
        from fact_order o
        join fact_order_item i on i.order_id = o.order_id
        join dim_sku k on i.sku_id = k.sku_id
        join dim_category c on k.category_id = c.category_id
        where o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
          and c.category_l1 = '美妆个护'
      trap: 按明细行求平均，多件商品的订单权重被放大
      expect:
        tables: [fact_order, fact_order_item, dim_sku, dim_category]
        metrics: [笔单价]
        values: [美妆个护]
      order_matters: false

- id: fanout_04
  category: fanout
  tags: [多表, 分组, 销量]
  difficulty: medium
  today: "2025-12-31"
  turns:
    - question: 2025 年各品牌卖出了多少件商品？
      paraphrases:
        - 今年每个品牌的销量是多少件
      gold_sql: |
        select k.brand_name as 品牌, sum(i.quantity) as 销量
        from fact_order_item i
        join fact_order o on i.order_id = o.order_id
        join dim_sku k on i.sku_id = k.sku_id
        where o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
        group by k.brand_name
      trap_sql: |
        select k.brand_name as 品牌, sum(o.item_quantity) as 销量
        from fact_order o
        join fact_order_item i on i.order_id = o.order_id
        join dim_sku k on i.sku_id = k.sku_id
        where o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
        group by k.brand_name
      trap: 用订单级的总件数按明细关联后求和，件数被重复计算且被算到所有品牌上
      expect:
        tables: [fact_order, fact_order_item, dim_sku]
      order_matters: false

- id: fanout_05
  category: fanout
  tags: [单表, 粒度, 平均值]
  difficulty: medium
  today: "2025-12-31"
  turns:
    - question: 2025 年平均每笔支付订单包含几件商品？
      paraphrases:
        - 今年每单平均买几件
      gold_sql: |
        select avg(item_quantity) as 平均件数
        from fact_order
        where pay_time is not null
          and pay_date_id between 20250101 and 20251231
      trap_sql: |
        select avg(i.quantity) as 平均件数
        from fact_order_item i
        join fact_order o on i.order_id = o.order_id
        where o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
      trap: 按明细行求平均，得到的是“每个 SKU 平均几件”而不是“每单平均几件”
      expect:
        tables: [fact_order]
      order_matters: false

# ---------------------------------------------------------------------------
# 3. 退款扣减：只有“退款成功”才是实际发生的退款
# ---------------------------------------------------------------------------
- id: refund_01
  category: refund
  tags: [多表, 指标, 净额]
  difficulty: hard
  today: "2025-12-31"
  must_pass: true
  turns:
    - question: 2025 年支付的订单，扣除退款成功的金额后，净销售额是多少？
      paraphrases:
        - 今年的净成交额是多少（支付金额减去成功退款）
      gold_sql: |
        select
          (select sum(order_amount) from fact_order
           where pay_time is not null and pay_date_id between 20250101 and 20251231)
          -
          (select coalesce(sum(r.refund_amount), 0)
           from fact_refund r
           join fact_order o on r.order_id = o.order_id
           where r.refund_status = '退款成功'
             and o.pay_date_id between 20250101 and 20251231) as 净销售额
      trap_sql: |
        select
          (select sum(order_amount) from fact_order
           where pay_time is not null and pay_date_id between 20250101 and 20251231)
          -
          (select coalesce(sum(r.refund_amount), 0)
           from fact_refund r
           join fact_order o on r.order_id = o.order_id
           where o.pay_date_id between 20250101 and 20251231) as 净销售额
      trap: 扣除了全部退款申请，包括被拒绝、已撤销和处理中的
      expect:
        tables: [fact_order, fact_refund]
        metrics: [净支付金额]
      order_matters: false

- id: refund_02
  category: refund
  tags: [单表, 状态]
  difficulty: easy
  today: "2025-12-31"
  turns:
    - question: 2025 年申请的退款中，实际退款成功的金额是多少？
      paraphrases:
        - 今年成功退了多少钱
      gold_sql: |
        select sum(refund_amount) as 退款成功金额
        from fact_refund
        where refund_status = '退款成功'
          and apply_date_id between 20250101 and 20251231
      trap_sql: |
        select sum(refund_amount) as 退款成功金额
        from fact_refund
        where apply_date_id between 20250101 and 20251231
      trap: 没有按退款状态筛选，把全部退款申请金额都算成了退款
      expect:
        tables: [fact_refund]
        values: [退款成功]
      order_matters: false

- id: refund_03
  category: refund
  tags: [多表, 雪花, 指标, 比率]
  difficulty: hard
  today: "2025-12-31"
  turns:
    - question: 2025 年支付的订单中，各一级类目的退款率是多少？
      paraphrases:
        - 今年各大类商品的退款金额占支付金额的比例
      gold_sql: |
        select c.category_l1 as 一级类目,
               sum(coalesce(r.refund_amount, 0)) / sum(i.pay_amount) as 退款率
        from fact_order_item i
        join fact_order o on i.order_id = o.order_id
        join dim_sku k on i.sku_id = k.sku_id
        join dim_category c on k.category_id = c.category_id
        left join (
          select order_item_id, sum(refund_amount) as refund_amount
          from fact_refund
          where refund_status = '退款成功'
          group by order_item_id
        ) r on r.order_item_id = i.order_item_id
        where o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
        group by c.category_l1
      trap_sql: |
        select c.category_l1 as 一级类目,
               sum(coalesce(r.refund_amount, 0)) / sum(i.pay_amount) as 退款率
        from fact_order_item i
        join fact_order o on i.order_id = o.order_id
        join dim_sku k on i.sku_id = k.sku_id
        join dim_category c on k.category_id = c.category_id
        left join (
          select order_item_id, sum(refund_amount) as refund_amount
          from fact_refund
          group by order_item_id
        ) r on r.order_item_id = i.order_item_id
        where o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
        group by c.category_l1
      trap: 分子包含了未成功的退款申请
      expect:
        tables: [fact_order, fact_order_item, fact_refund, dim_sku, dim_category]
        metrics: [退款率]
      order_matters: false

- id: refund_04
  category: refund
  tags: [单表, 状态]
  difficulty: medium
  today: "2025-12-31"
  turns:
    - question: 2025 年申请的退款中，被拒绝或者用户自己撤销的有多少单？
      paraphrases:
        - 今年最终没有退成的退款申请有几笔（拒绝或撤销）
      gold_sql: |
        select count(*) as 未退成退款单数
        from fact_refund
        where refund_status in ('已拒绝', '已撤销')
          and apply_date_id between 20250101 and 20251231
      trap_sql: |
        select count(*) as 未退成退款单数
        from fact_refund
        where refund_status <> '退款成功'
          and apply_date_id between 20250101 and 20251231
      trap: 用“不是退款成功”代替“拒绝或撤销”，把仍在处理中的退款也算进去
      expect:
        tables: [fact_refund]
        values: [已拒绝, 已撤销]
      order_matters: false

- id: refund_05
  category: refund
  tags: [多表, 指标, 净额, 排序, TopN]
  difficulty: hard
  today: "2025-12-31"
  turns:
    - question: 2025 年净销售额最高的 5 家店铺是哪些？净销售额是支付金额减去成功退款金额。
      paraphrases:
        - 今年扣除退款后卖得最好的 5 家店
      gold_sql: |
        select s.shop_name as 店铺, sum(o.order_amount) - coalesce(sum(r.refund_amount), 0) as 净销售额
        from fact_order o
        join dim_shop s on o.shop_id = s.shop_id
        left join (
          select order_id, sum(refund_amount) as refund_amount
          from fact_refund
          where refund_status = '退款成功'
          group by order_id
        ) r on r.order_id = o.order_id
        where o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
        group by s.shop_name
        order by 净销售额 desc
        limit 5
      trap_sql: |
        select s.shop_name as 店铺, sum(o.order_amount) as 净销售额
        from fact_order o
        join dim_shop s on o.shop_id = s.shop_id
        where o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
        group by s.shop_name
        order by 净销售额 desc
        limit 5
      trap: 没有扣除退款
      expect:
        tables: [fact_order, fact_refund, dim_shop]
        metrics: [净支付金额]
      order_matters: true

# ---------------------------------------------------------------------------
# 4. 日期角色：同一张日期表被下单 支付 退款申请 行为等多个日期字段引用
# ---------------------------------------------------------------------------
- id: date_role_01
  category: date_role
  tags: [单表, 日期角色]
  difficulty: medium
  today: "2025-12-31"
  turns:
    - question: 2025 年 11 月 11 日当天完成支付的订单有多少笔？
      paraphrases:
        - 今年双 11 当天付款的订单数
      gold_sql: |
        select count(*) as 支付订单数
        from fact_order
        where pay_date_id = 20251111
      trap_sql: |
        select count(*) as 支付订单数
        from fact_order
        where order_date_id = 20251111 and pay_time is not null
      trap: 用下单日期代替支付日期，漏掉 10 号下单 11 号支付的，多算 11 号下单 12 号支付的
      expect:
        tables: [fact_order]
        metrics: [支付订单数]
      order_matters: false

- id: date_role_02
  category: date_role
  tags: [多表, 日期角色, 状态]
  difficulty: medium
  today: "2025-12-31"
  turns:
    - question: 2025 年 12 月申请的退款中，退款成功的金额是多少？
      paraphrases:
        - 这个月提交的退款申请，成功退了多少钱
      gold_sql: |
        select sum(refund_amount) as 退款成功金额
        from fact_refund
        where refund_status = '退款成功'
          and apply_date_id between 20251201 and 20251231
      trap_sql: |
        select sum(r.refund_amount) as 退款成功金额
        from fact_refund r
        join fact_order o on r.order_id = o.order_id
        where r.refund_status = '退款成功'
          and o.pay_date_id between 20251201 and 20251231
      trap: 按订单支付日期筛选，而不是按退款申请日期
      expect:
        tables: [fact_refund]
        values: [退款成功]
      order_matters: false

- id: date_role_03
  category: date_role
  tags: [单表, 日期角色]
  difficulty: hard
  today: "2025-12-31"
  turns:
    - question: 2025 年 11 月完成的退款（按退款完成时间），成功退款金额是多少？
      paraphrases:
        - 11 月份退款到账的金额是多少
      gold_sql: |
        select sum(refund_amount) as 退款成功金额
        from fact_refund
        where refund_status = '退款成功'
          and finish_time >= '2025-11-01' and finish_time < '2025-12-01'
      trap_sql: |
        select sum(refund_amount) as 退款成功金额
        from fact_refund
        where refund_status = '退款成功'
          and apply_date_id between 20251101 and 20251130
      trap: 用退款申请日期代替退款完成时间，月初月末跨月处理的退款被归错月份
      expect:
        tables: [fact_refund]
        values: [退款成功]
      order_matters: false

- id: date_role_04
  category: date_role
  tags: [单表, 日期角色, 用户]
  difficulty: medium
  today: "2025-12-31"
  turns:
    - question: 2025 年每个季度新注册了多少用户？
      paraphrases:
        - 今年各季度的新增注册用户数
      gold_sql: |
        select quarter(register_date) as 季度, count(*) as 新注册用户数
        from dim_user
        where register_date between '2025-01-01' and '2025-12-31'
        group by quarter(register_date)
      trap_sql: |
        select d.quarter as 季度, count(distinct o.user_id) as 新注册用户数
        from fact_order o
        join dim_date d on o.order_date_id = d.date_id
        where d.year = 2025
        group by d.quarter
      trap: 用下单日期统计用户，得到的是下单用户数而不是注册用户数
      expect:
        tables: [dim_user]
      order_matters: false

