- id: region_role_05
  category: region_role
  tags: [多表, 地区角色, 自关联]
  difficulty: hard
  today: "2025-12-31"
  turns:
    - question: 2025 年有多少支付订单的收货城市和下单用户的常住城市不是同一个城市？
      paraphrases:
        - 今年寄往外地（非用户所在城市）的成交订单有多少
      gold_sql: |
        select count(*) as 异地订单数
        from fact_order o
        join dim_user u on o.user_id = u.user_id
        where o.receiver_region_id <> u.region_id
          and o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
      trap_sql: |
        select count(*) as 异地订单数
        from fact_order o
        join dim_user u on o.user_id = u.user_id
        join dim_region rr on o.receiver_region_id = rr.region_id
        join dim_region ur on u.region_id = ur.region_id
        where rr.area <> ur.area
          and o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
      trap: 比较的是大区而不是城市，同一大区内的异地订单被漏掉
      expect:
        tables: [fact_order, dim_user]
      order_matters: false

# ---------------------------------------------------------------------------
# 6. 雪花关联与类目层级：商品经 dim_sku.category_id 关联三级类目；毛利要乘件数
# ---------------------------------------------------------------------------
- id: snowflake_01
  category: snowflake
  tags: [多表, 雪花, 指标, 毛利]
  difficulty: hard
  today: "2025-12-31"
  must_pass: true
  turns:
    - question: 2025 年美妆个护类目的毛利是多少？
      paraphrases:
        - 今年美妆个护赚了多少毛利
      gold_sql: |
        select sum(i.pay_amount - k.cost_price * i.quantity) as 毛利
        from fact_order_item i
        join fact_order o on i.order_id = o.order_id
        join dim_sku k on i.sku_id = k.sku_id
        join dim_category c on k.category_id = c.category_id
        where c.category_l1 = '美妆个护'
          and o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
      trap_sql: |
        select sum(i.pay_amount - k.cost_price) as 毛利
        from fact_order_item i
        join fact_order o on i.order_id = o.order_id
        join dim_sku k on i.sku_id = k.sku_id
        join dim_category c on k.category_id = c.category_id
        where c.category_l1 = '美妆个护'
          and o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
      trap: 成本价是单件成本，没有乘以件数
      expect:
        tables: [fact_order, fact_order_item, dim_sku, dim_category]
        metrics: [毛利]
        values: [美妆个护]
      order_matters: false

- id: snowflake_02
  category: snowflake
  tags: [多表, 雪花, 指标, 比率]
  difficulty: hard
  today: "2025-12-31"
  turns:
    - question: 2025 年手机数码类目的毛利率是多少？
      paraphrases:
        - 今年手机数码的毛利率
      gold_sql: |
        select sum(i.pay_amount - k.cost_price * i.quantity) / sum(i.pay_amount) as 毛利率
        from fact_order_item i
        join fact_order o on i.order_id = o.order_id
        join dim_sku k on i.sku_id = k.sku_id
        join dim_category c on k.category_id = c.category_id
        where c.category_l1 = '手机数码'
          and o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
      trap_sql: |
        select sum((k.list_price - k.cost_price) * i.quantity) / sum(k.list_price * i.quantity) as 毛利率
        from fact_order_item i
        join fact_order o on i.order_id = o.order_id
        join dim_sku k on i.sku_id = k.sku_id
        join dim_category c on k.category_id = c.category_id
        where c.category_l1 = '手机数码'
          and o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
      trap: 用标价代替实付金额计算，忽略了活动降价和优惠
      expect:
        tables: [fact_order, fact_order_item, dim_sku, dim_category]
        metrics: [毛利]
        values: [手机数码]
      order_matters: false

- id: snowflake_03
  category: snowflake
  tags: [多表, 雪花, 类目层级, 销量]
  difficulty: medium
  today: "2025-12-31"
  turns:
    - question: 2025 年三级类目“手机”一共卖了多少台？
      paraphrases:
        - 今年手机（三级类目）的销量
      gold_sql: |
        select sum(i.quantity) as 销量
        from fact_order_item i
        join fact_order o on i.order_id = o.order_id
        join dim_sku k on i.sku_id = k.sku_id
        join dim_category c on k.category_id = c.category_id
        where c.category_l3 = '手机'
          and o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
      trap_sql: |
        select sum(i.quantity) as 销量
        from fact_order_item i
        join fact_order o on i.order_id = o.order_id
        join dim_sku k on i.sku_id = k.sku_id
        where k.sku_name like '%手机%'
          and o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
      trap: 用商品名称模糊匹配代替类目，把“磁吸手机壳”等配件也算成了手机
      expect:
        tables: [fact_order, fact_order_item, dim_sku, dim_category]
        values: [手机]
      order_matters: false

- id: snowflake_04
  category: snowflake
  tags: [多表, 雪花, 指标, 分组]
  difficulty: medium
  today: "2025-12-31"
  turns:
    - question: 2025 年各一级类目的件单价是多少？
      paraphrases:
        - 今年每个大类平均每件卖多少钱
      gold_sql: |
        select c.category_l1 as 一级类目, sum(i.pay_amount) / sum(i.quantity) as 件单价
        from fact_order_item i
        join fact_order o on i.order_id = o.order_id
        join dim_sku k on i.sku_id = k.sku_id
        join dim_category c on k.category_id = c.category_id
        where o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
        group by c.category_l1
      trap_sql: |
        select c.category_l1 as 一级类目, avg(i.unit_price) as 件单价
        from fact_order_item i
        join fact_order o on i.order_id = o.order_id
        join dim_sku k on i.sku_id = k.sku_id
        join dim_category c on k.category_id = c.category_id
        where o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
        group by c.category_l1
      trap: 对成交单价做简单平均，没有扣除优惠，也没有按件数加权
      expect:
        tables: [fact_order, fact_order_item, dim_sku, dim_category]
        metrics: [件单价]
      order_matters: false

