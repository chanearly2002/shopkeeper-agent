- id: region_role_03
  category: region_role
  tags: [多表, 地区角色, 分组, 去重]
  difficulty: medium
  today: "2025-12-31"
  turns:
    - question: 按用户常住地所在大区统计，2025 年各大区有多少支付买家？
      paraphrases:
        - 今年各大区的购买人数（按用户所在地）
      gold_sql: |
        select r.area as 大区, count(distinct o.user_id) as 支付买家数
        from fact_order o
        join dim_user u on o.user_id = u.user_id
        join dim_region r on u.region_id = r.region_id
        where o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
        group by r.area
      trap_sql: |
        select r.area as 大区, count(distinct o.user_id) as 支付买家数
        from fact_order o
        join dim_region r on o.receiver_region_id = r.region_id
        where o.pay_time is not null
          and o.pay_date_id between 20250101 and 20251231
        group by r.area
      trap: 按收货地所在大区统计，一个用户寄往多个大区时会被重复计入
      expect:
        tables: [fact_order, dim_user, dim_region]
        metrics: [支付买家数]
      order_matters: false

