        from fact_refund
        where refund_status = '退款成功'
          and apply_date_id between 20250101 and 20251231
      trap_sql: |
        select count(*) as 退款订单数
        from fact_refund
        where refund_status = '退款成功'
          and apply_date_id between 20250101 and 20251231
      trap: 一笔订单可能有多个商品退款，按退款单计数会重复
      expect:
