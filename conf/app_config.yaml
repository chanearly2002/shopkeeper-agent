logging:
  file:
    enable: true
    level: INFO
    path: logs
    rotation: "10 MB"
    retention: "7 days"
  console:
    enable: true
    level: INFO

db_meta:
  host: 127.0.0.1
  port: 3306
  user: early
  password: dili123
  database: meta

db_dw:
  host: 127.0.0.1
  port: 3306
  user: early
  password: dili123
  database: dw

qdrant:
  host: localhost
  port: 6333
  embedding_size: 1024
  column_collection: column_info_collection
  metric_collection: metric_info_collection
  # 余弦相似度阈值（0~1），低于该值的字段/指标不进入候选
  score_threshold: 0.6
  # 每个检索词最多返回的 point 数
  limit: 20

embedding:
  host: localhost
  port: 8081
  model: BAAI/bge-large-zh-v1.5

es:
  host: localhost
  port: 9200
  index_name: value_index
  # BM25 原始得分阈值，未归一化，和 Qdrant 的余弦阈值不是同一量纲，需按实际数据单独标定
  # 在教学数仓上实测：正确命中最低约 3.8（如“华为”命中“华为官方旗舰店”），完全匹配约 9~27；
  # 共享词造成的噪声（如“金卡会员”命中“普通会员”）得分同样可达 8 分以上，只能交给后续过滤节点处理
  min_score: 2.0
  # 每个检索词最多返回的取值数
  limit: 20

llm:
  # 本地改动：改用智谱开放平台 glm-5.3-flash（原配置为硅基流动 Pro/zai-org/GLM-5.1）
  model_name: glm-5.3-flash
  api_key: ${oc.env:LLM_API_KEY}
  base_url: https://open.bigmodel.cn/api/paas/v4/

knowledge:
  # 业务术语和已验证问答示例各自的 Qdrant 集合
  term_collection: term_collection
  example_collection: sql_example_collection
  # 是否召回已验证问答示例作为 few-shot；评测时可以关掉做消融对比
  enable_examples: true
  # 最多召回几条示例，以及问题相似度阈值（余弦）
  example_top_k: 3
  example_score_threshold: 0.75

agent:
  # SQL 校验失败后最多修正几次，超过后结束本次查询并返回错误
  max_correct_attempts: 2
  # SQL 能执行后，是否再按外键 ref 关系做语义检查（扇出聚合、关联条件不符合 ref）；
  # 发现问题会交给 correct_sql 修正，修正次数用完时只告警、不阻断
  semantic_check: true
  # 单次查询最多返回给前端的行数，超出部分截断
  max_result_rows: 1000
  # 单条查询在 MySQL 中的最长执行时间（毫秒），0 表示不限制
  max_execution_ms: 30000
  # 注入给模型的“今天”。教学数仓的数据覆盖 2024-01-01 ~ 2025-12-31，固定到最后一天
  # 才能让“本月”“最近 7 天”“去年同期”等相对时间查出结果；设为 null 则使用真实当前日期
  today: "2025-12-31"

conversation:
  # 多轮改写时带给模型的最近轮数，更早的轮次不进入提示词
  history_turns: 3
  # 每轮结果在会话记忆里保留的行数（另记列名、总行数），供追问引用“第一名”等结果
  result_preview_rows: 5

api:
  # 允许跨域访问后端的前端地址；同域部署或走 Vite 代理时不需要
  cors_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
